<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shell — BNG People</title>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/FelipeSilveiraBNG/ppl-compass@0.4.1/dist/ppl-compass.css"
      integrity="sha384-E/qBbSGDbYr5hi+Q+4F1wUy5uXO+0q56bzlXkG86ngrjw1upmDRUvA3d1m/MBjhT"
      crossorigin="anonymous">
</head>
<body data-brand="people">

<!-- ════════════════════════════════════════════════════════════════════════
     A CASCA. Todos os outros templates são este arquivo com conteúdo dentro
     do <main>. Para a tela seguinte: copie, troque "rotaAtiva", troque a
     migalha do topo e escreva o miolo.

     A navegação inteira sai do JSON abaixo — é por isso que dez telas não
     custam dez cópias de marcação, e sim dez vezes a mesma lista com uma rota
     diferente. Item sem rótulo, grupo vazio, contador que não é número ou
     rota ativa fora do menu trocam a navegação por um alerta: ela falha
     fechado de propósito, porque menu que não sabe onde você está mente com
     confiança.
     ════════════════════════════════════════════════════════════════════ -->

<div class="ppl-shell">

  <aside class="ppl-nav" data-ppl-nav>
    <script type="application/json">
    {
      "rotaAtiva": "/",
      "marca":  { "sigla": "b", "nome": "BNG People", "tag": "Depto. Pessoal" },
      "itens": [
        { "label": "Início",     "icone": "home",         "href": "/" },
        { "label": "Pendências", "icone": "alert-circle", "href": "/pendencias", "contador": 184368 },
        { "grupo": "Estrutura", "itens": [
          { "label": "Empresas",      "icone": "building", "href": "/empresas" },
          { "label": "Colaboradores", "icone": "users",    "href": "/colaboradores" },
          { "label": "Lotações",      "icone": "map-pin",  "href": "/lotacoes" }
        ]},
        { "grupo": "Folha", "itens": [
          { "label": "Rubricas",  "icone": "list",       "href": "/rubricas" },
          { "label": "Folha",     "icone": "wallet",     "href": "/folha" },
          { "label": "Férias",    "icone": "palm",       "href": "/ferias" },
          { "label": "Rescisões", "icone": "calendar-x", "href": "/rescisoes" }
        ]},
        { "grupo": "Ponto", "itens": [
          { "label": "Espelho",   "icone": "calendar",     "href": "/ponto" },
          { "label": "Correções", "icone": "clock-dashed", "href": "/correcoes", "contador": 42 }
        ]},
        { "grupo": "Obrigações", "itens": [
          { "label": "eSocial",    "icone": "send", "href": "/esocial" },
          { "label": "Relatórios", "icone": "file", "href": "/relatorios" }
        ]}
      ],
      "usuario": {
        "iniciais": "AR",
        "nome": "ana.ribeiro@gestaohospitalar.com.br",
        "papel": "Console RH",
        "sair": "/sair"
      }
    }
    </script>
  </aside>

  <div class="ppl-shell__col ppl-canvas">

    <header class="ppl-topbar ppl-bar">
      <div class="ppl-topbar__row">
        <span class="ppl-eyebrow">Grupo Boas Novas</span>
        <span class="ppl-topbar__crumb"><i data-ppl-icon="house" data-ppl-size="15"></i>Início</span>
        <div class="ppl-topbar__actions">
          <button class="ppl-btn ppl-btn--icon ppl-btn--secondary" aria-label="Produtos">
            <i data-ppl-icon="layout-grid" data-ppl-size="16"></i>
          </button>
          <button class="ppl-btn ppl-btn--icon ppl-btn--secondary" aria-label="Buscar" data-ppl-search-open>
            <i data-ppl-icon="search" data-ppl-size="16"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="ppl-main">
      <div class="ppl-page-head">
        <div class="ppl-page-head__id">
          <div class="ppl-page-head__meta ppl-eyebrow">Competência 2026-08 · Gestão Hospitalar Ltda</div>
          <h1 class="ppl-page-head__title">Título da tela</h1>
          <p class="ppl-page-head__desc">
            O contexto que decide — quem, qual CNPJ, qual competência — fica visível do início ao
            fim do fluxo. Ele mora aqui, não numa tela anterior.
          </p>
        </div>
        <div class="ppl-page-head__actions">
          <button class="ppl-btn ppl-btn--secondary ppl-btn--sm">Ação secundária</button>
          <button class="ppl-btn ppl-btn--primary ppl-btn--sm">Ação primária</button>
        </div>
      </div>

      <div class="ppl-card ppl-panel">
        <p class="ppl-muted">O miolo entra aqui. Veja templates/README.md para escolher o arquétipo.</p>
      </div>
    </main>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/gh/FelipeSilveiraBNG/ppl-compass@0.4.1/dist/ppl-compass-icons.js"
        integrity="sha384-K7HJQ+0th6kgYPtM02Ac4GpT4x/2JVA8oI33rClJ/XEdNIkGmSK+Z4IkMfyJqcHb" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/gh/FelipeSilveiraBNG/ppl-compass@0.4.1/dist/ppl-compass.js"
        integrity="sha384-eJhMCyv17Hx5PMkBjZdtZEJxyDdsLjU4a9qKfqP7Z1L0Tpve8sVHqxVNWiHC07rq" crossorigin="anonymous"></script>
<script>addEventListener('DOMContentLoaded', () => PplCompass.init());</script>
</body>
</html>
