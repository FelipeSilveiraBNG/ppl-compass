<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ppl-compass — prova local (dist/)</title>

<!-- ============================================================================
     VARIANTE LOCAL — aponta para ../dist/, não para o CDN.

     Valida o CONTEÚDO antes de publicar. Se aqui reprovar, o problema é o
     pacote; se aqui aprovar e proof.html reprovar, o problema é a entrega
     (owner, tag, SRI, propagação).
     ============================================================================ -->
<link rel="stylesheet" href="../dist/ppl-compass.css">

<style>
  /* Cromo da prova. Independente do CSS testado de propósito: se o CDN falhar,
     esta página ainda precisa ser legível para dizer o que falhou. */
  body { font: 15px/1.5 system-ui, sans-serif; color: #132c63; background: #f2f5fc;
         margin: 0; padding: 40px 24px; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #5a6486; margin: 0 0 28px; }
  .alvo { min-height: 140px; display: grid; place-items: center; gap: 12px; }
  .alvo.falhou { border: 3px dashed #c0392b; border-radius: 16px; color: #c0392b; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; margin-top: 28px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e2e8f4; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #5a6486; }
  td.v { font-family: ui-monospace, monospace; font-size: 13px; }
  .ok { color: #0e8a4f; font-weight: 600; }
  .fail { color: #c0392b; font-weight: 600; }
  .info { color: #5a6486; }
</style>
</head>
<body>
<main>
  <h1>ppl-compass</h1>
  <p class="sub">Prova <strong>local</strong> — valida dist/ antes de publicar.</p>

  <div class="alvo">
    <button class="ppl-btn ppl-btn--primary ppl-btn--touch" id="alvo-btn">Botão primário do pacote</button>
  </div>

  <!-- Sondas de fonte. A fonte só é BAIXADA se algum elemento a usar — sem
       isto, document.fonts.check() responderia "não carregada" sobre um
       arquivo que nunca chegou a ser pedido, e o diagnóstico culparia o
       pacote por um teste mal montado. Fora da tela, fora da árvore de
       acessibilidade, mas renderizadas. -->
  <p class="ppl-sr-only" aria-hidden="true">
    <span style="font-family:var(--ppl-font-sans)">sonda</span>
    <span class="ppl-data">sonda</span>
    <span class="ppl-display">sonda</span>
  </p>

  <table>
    <thead><tr><th>Verificação</th><th>Resultado</th></tr></thead>
    <tbody id="diag"></tbody>
  </table>
</main>

<script src="../dist/ppl-compass-icons.js"></script>
<script src="../dist/ppl-compass.js"></script>
<script>
/**
 * Diagnóstico honesto: mede e mostra o que mediu.
 *
 * A fonte de verdade é o estilo COMPUTADO. A presença do <link> no DOM não
 * prova nada — um <link> que falhou continua sendo um nó, e `styleSheets` pode
 * listar a folha sem ela ter aplicado regra nenhuma.
 */
var AZUL = 'rgb(47, 90, 208)';
var alvo = document.querySelector('.alvo');
var btn = document.getElementById('alvo-btn');
var linhas = [];

var esc = function (s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
  });
};

function add(nome, valor, estado) {
  var classe = estado === 'ok' ? 'ok' : estado === 'fail' ? 'fail' : 'info';
  linhas.push('<tr><td>' + nome + '</td><td class="v ' + classe + '">' + esc(valor) + '</td></tr>');
}

/* 1 · o token chegou */
var token = getComputedStyle(document.documentElement).getPropertyValue('--ppl-primary').trim();
add('Token <code>--ppl-primary</code>', token || '(vazio)', token === '#2f5ad0' ? 'ok' : 'fail');

/* 2 · o componente pintou — é este que decide */
var cor = getComputedStyle(btn).backgroundColor;
var pintou = cor === AZUL;
add('Fundo de <code>.ppl-btn--primary</code>', cor, pintou ? 'ok' : 'fail');

/* 3 · a fonte self-hospedada chegou DE VERDADE
      `getComputedStyle` devolveria só a família DECLARADA — diria "Urbanist"
      mesmo com o .woff2 404. A Font Loading API responde se o arquivo foi
      carregado. Assíncrona: a linha entra depois, quando fonts.ready resolve. */
function medirFontes() {
  var faltando = ['Urbanist', 'JetBrains Mono'].filter(function (f) {
    return !document.fonts.check('16px "' + f + '"');
  });
  var linha = document.createElement('tr');
  linha.innerHTML = '<td>Fontes self-hospedadas</td><td class="v ' +
    (faltando.length ? 'fail' : 'ok') + '">' +
    (faltando.length ? 'faltando: ' + faltando.join(', ') : 'Urbanist e JetBrains Mono carregadas') +
    '</td>';
  var corpo = document.getElementById('diag');
  corpo.insertBefore(linha, corpo.children[2] || null);
}

/* 4 · comportamento e ícones */
var temJs = typeof PplCompass === 'object';
add('<code>window.PplCompass</code>', typeof PplCompass, temJs ? 'ok' : 'fail');
var nIcons = (typeof PplCompassIcons === 'object') ? PplCompassIcons.nomes().length : 0;
add('Ícones disponíveis', String(nIcons), nIcons > 0 ? 'ok' : 'fail');

/* 5 · contexto — informativo, nunca veredito.
      `cssRules` lança SecurityError em folha cross-origin TANTO quando ela
      carregou quanto quando falhou: o erro não distingue os dois casos. */
var link = document.querySelector('link[href*="ppl-compass"]');
var folha = [].slice.call(document.styleSheets).filter(function (s) {
  return (s.href || '').indexOf('ppl-compass') !== -1;
})[0];
var situacao;
if (!folha) {
  situacao = 'nenhuma folha do CDN no documento';
} else {
  try {
    situacao = folha.cssRules.length > 0
      ? folha.cssRules.length + ' regra(s) legível(is)'
      : 'presente, ZERO regras';
  } catch (e) {
    situacao = 'presente; não inspecionável (cross-origin)';
  }
}
add('Folha carregada', situacao);
add('URL', link ? link.getAttribute('href') : '—');

/* 6 · veredito */
var passou = pintou && temJs;
add('<strong>Veredito</strong>',
    passou ? 'APROVADA — o conteúdo de dist/ está correto'
           : 'REPROVADA — dist/ não aplicou',
    passou ? 'ok' : 'fail');

if (!passou) {
  alvo.classList.add('falhou');
  var aviso = document.createElement('p');
  aviso.textContent = 'Pacote de dist/ não carregou';
  alvo.appendChild(aviso);
}

document.getElementById('diag').innerHTML = linhas.join('');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(medirFontes);
</script>
</body>
</html>
